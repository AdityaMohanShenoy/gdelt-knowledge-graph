<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Causal claim review</title>
<style>
  :root{
    --paper:#f4f5f7; --card:#fbfbfc; --ink:#15181c; --soft:#5a626b;
    --rule:#dce0e5; --brass:#8a6a2f; --accept:#15803d; --reject:#b91c1c;
    --edit:#b45309; --focus:#1d4ed8;
    --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5}
  .bar{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
       padding:.7rem 1.4rem;border-bottom:1px solid var(--rule);background:var(--card)}
  .bar b{font-weight:600}
  .bar span{color:var(--soft);font-size:.86rem}
  main{max-width:60rem;margin:0 auto;padding:1.6rem 1.4rem 5rem}

  /* The lag axis: cause left, effect right, the gap shown as real distance. */
  .axis{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:end;
        padding:1.6rem 0 1.1rem}
  .node h2{margin:.15rem 0 .3rem;font-size:1.45rem;font-weight:600;letter-spacing:-.01em}
  .node time{display:block;font-variant-numeric:tabular-nums;color:var(--soft);font-size:.9rem}
  .node p{margin:.35rem 0 0;font-family:var(--serif);font-size:1rem;color:var(--ink)}
  .node.effect{text-align:right}
  .role{font-size:.8rem;color:var(--brass);font-weight:600}
  .gap{display:flex;flex-direction:column;align-items:center;gap:.3rem;
       padding-bottom:.4rem;min-width:7rem}
  .gap .days{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--brass)}
  .gap .line{width:100%;height:1px;background:linear-gradient(90deg,var(--rule),var(--brass))}

  .evidence{background:var(--card);border:1px solid var(--rule);border-radius:3px;
            padding:1.1rem 1.25rem;margin-top:.5rem}
  .evidence h3{margin:0 0 .7rem;font-size:.95rem;font-weight:600}
  .ch{display:grid;grid-template-columns:9rem 1fr;gap:.6rem;padding:.45rem 0;
      border-top:1px solid var(--rule);font-size:.93rem}
  .ch:first-of-type{border-top:none}
  .ch .k{color:var(--soft)}
  .ch .v{font-family:var(--serif)}
  .ch.off .v{color:var(--soft);font-style:italic}
  .machine{margin-top:.9rem;padding-top:.7rem;border-top:1px dashed var(--rule);
           color:var(--soft);font-size:.88rem}
  .machine[hidden]{display:none}

  .actions{position:fixed;left:0;right:0;bottom:0;background:var(--card);
           border-top:1px solid var(--rule);padding:.8rem 1.4rem}
  .actions .row{max-width:60rem;margin:0 auto;display:flex;gap:.6rem;flex-wrap:wrap;
                align-items:center}
  button{font:inherit;font-weight:600;padding:.5rem 1rem;border-radius:3px;
         border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--soft)}
  button:focus-visible,select:focus-visible,input:focus-visible{
         outline:2px solid var(--focus);outline-offset:2px}
  button.accept{border-color:var(--accept);color:var(--accept)}
  button.reject{border-color:var(--reject);color:var(--reject)}
  button.edit{border-color:var(--edit);color:var(--edit)}
  kbd{font:inherit;font-size:.78rem;color:var(--soft);border:1px solid var(--rule);
      border-radius:2px;padding:0 .3rem;margin-left:.35rem}
  .panel{max-width:60rem;margin:.7rem auto 0;display:none;gap:.5rem;flex-wrap:wrap;
         align-items:center}
  .panel.open{display:flex}
  select,input[type=text],input[type=number]{font:inherit;padding:.42rem .5rem;
         border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
  input[type=text]{flex:1;min-width:12rem}
  .empty{text-align:center;padding:5rem 1rem;font-family:var(--serif);font-size:1.15rem}
  .hint{color:var(--soft);font-size:.82rem}
  @media (max-width:620px){
    .axis{grid-template-columns:1fr;gap:.4rem}
    .node.effect{text-align:left}
    .gap{align-items:flex-start;min-width:0}
    .gap .line{width:4rem}
  }
  @media (prefers-reduced-motion:no-preference){
    main{animation:in .18s ease-out}
    @keyframes in{from{opacity:.4}to{opacity:1}}
  }
</style>
</head>
<body>
<div class="bar">
  <b>Causal claim review</b>
  <span id="progress">loading</span>
</div>

<main id="screen"><div class="empty">Loading the first claim.</div></main>

<div class="actions">
  <div class="row">
    <button class="accept" data-act="accept">Accept<kbd>a</kbd></button>
    <button class="edit" data-act="edit">Change strength<kbd>e</kbd></button>
    <button class="reject" data-act="reject">Reject<kbd>r</kbd></button>
    <span class="hint" id="hint">Press m to see what the scorer thought.</span>
  </div>
  <div class="panel" id="editPanel">
    <label for="relation">Relation</label>
    <select id="relation"></select>
    <label for="strength">Strength</label>
    <input type="number" id="strength" min="0" max="1" step="0.05" value="0.6">
    <button data-act="save-edit">Save</button>
  </div>
  <div class="panel" id="rejectPanel">
    <select id="reason"></select>
    <input type="text" id="reasonText" placeholder="Anything worth remembering about this one">
    <button data-act="save-reject">Save rejection</button>
  </div>
</div>

<script>
const annotator = new URLSearchParams(location.search).get("annotator") || "anonymous";
let claim = null, meta = null, showMachine = false;

const $ = (id) => document.getElementById(id);

async function boot(){
  meta = await (await fetch("/api/meta")).json();
  $("reason").innerHTML = meta.reject_reasons
    .map((r,i) => `<option value="${r}">${i+1} · ${r.replaceAll("_"," ").toLowerCase()}</option>`).join("");
  $("relation").innerHTML = meta.relation_types
    .map(r => `<option value="${r}">${r.toLowerCase()}</option>`).join("");
  await load();
}

async function load(){
  claim = await (await fetch("/api/claims/next")).json();
  const p = await (await fetch("/api/progress")).json();
  $("progress").textContent =
    `${p.accepted} accepted, ${p.rejected} rejected — ${p.targets_left} events still to look at`;
  render();
}

function render(){
  const s = $("screen");
  if (claim.done){
    s.innerHTML = `<div class="empty">Everything seeded has been judged.<br>
      <span class="hint">Seed more with <code>14_run_annotator.py seed</code>.</span></div>`;
    document.querySelectorAll(".actions button").forEach(b => b.disabled = true);
    return;
  }
  const ch = claim.channels.map(c => {
    const off = !c.available;
    return `<div class="ch${off?" off":""}">
      <div class="k">${c.raw_inputs.question || c.channel_key}</div>
      <div class="v">${c.raw_inputs.plain || ""}</div></div>`;
  }).join("");
  s.innerHTML = `
    <div class="axis">
      <div class="node cause">
        <div class="role">Proposed cause</div>
        <h2>${claim.cause_type}</h2>
        <time>${claim.cause_time}</time>
        <p>${claim.cause_actors || ""}</p>
      </div>
      <div class="gap">
        <div class="days">${claim.lag_days} days later</div>
        <div class="line"></div>
      </div>
      <div class="node effect">
        <div class="role">Event being explained</div>
        <h2>${claim.effect_type}</h2>
        <time>${claim.effect_time}</time>
        <p>${claim.effect_actors || ""}</p>
      </div>
    </div>
    <section class="evidence">
      <h3>What the evidence says</h3>
      ${ch}
      <div class="machine" id="machine" ${showMachine ? "" : "hidden"}>
        The scorer put this at ${claim.machine_strength} and graded it
        ${claim.grade}. Shown only on request, so it cannot anchor your own number.
      </div>
    </section>`;
  closePanels();
}

function closePanels(){
  $("editPanel").classList.remove("open");
  $("rejectPanel").classList.remove("open");
}

async function send(body){
  await fetch(`/api/claims/${claim.claim_id}/judge`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({annotator, ...body}),
  });
  await load();
}

document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act || !claim || claim.done) return;
  if (act === "accept") return send({action:"accept", human_strength:claim.machine_strength});
  if (act === "edit"){ closePanels(); $("editPanel").classList.add("open"); $("strength").focus(); return; }
  if (act === "reject"){ closePanels(); $("rejectPanel").classList.add("open"); $("reason").focus(); return; }
  if (act === "save-edit") return send({action:"edit",
      relation_type:$("relation").value, human_strength:parseFloat($("strength").value)});
  if (act === "save-reject") return send({action:"reject",
      reject_reason:$("reason").value, reason_text:$("reasonText").value || null});
});

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) {
    if (e.key === "Enter") document.querySelector(".panel.open [data-act]")?.click();
    return;
  }
  if (!claim || claim.done) return;
  const k = e.key.toLowerCase();
  if (k === "a") document.querySelector('[data-act="accept"]').click();
  if (k === "e") document.querySelector('[data-act="edit"]').click();
  if (k === "r") document.querySelector('[data-act="reject"]').click();
  if (k === "m"){ showMachine = !showMachine; $("machine")?.toggleAttribute("hidden", !showMachine); }
  if (k === "escape") closePanels();
  if (/^[1-8]$/.test(k) && $("rejectPanel").classList.contains("open")){
    $("reason").selectedIndex = Number(k) - 1;
  }
});

boot();
</script>
</body>
</html>
