[project]
name = "decoding-domino-effect"
version = "0.1.0"
description = "Evidence-backed causal reasoning over a temporal knowledge graph of Indian protests and civil unrest."
readme = "PROJECT_CONTEXT.md"
requires-python = ">=3.11,<3.15"
# Runtime only, matching requirements.txt. Vercel's Python builder resolves
# from pyproject/uv.lock in preference to requirements.txt, so anything listed
# here lands in the dashboard's function bundle. It once carried torch,
# transformers, spacy, prefect and qdrant — none of which anything imports —
# and the resulting 5.6GB bundle broke the deploy outright.
#
# pandas especially: CLAUDE.md forbids it. It was 186MB of a 250MB limit.
# Pipeline and dev dependencies live in the groups below.
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
pipeline = [
    "aiohttp>=3.10.0",
    "asyncpg>=0.31.0",
    "neo4j>=5.25.0",
    "polars>=1.15.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.9.0",
    "trafilatura>=2.0.0",
]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "out", "out_parquet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
