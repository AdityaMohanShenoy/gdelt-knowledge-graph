services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gdelt
      POSTGRES_USER: gdelt
      POSTGRES_PASSWORD: gdelt_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pipeline/article_schema.sql:/docker-entrypoint-initdb.d/001_article_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdelt -d gdelt"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
